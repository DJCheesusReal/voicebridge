<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBridge</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; align-items: center; justify-content: center; }
.hidden { display: none !important; }

#auth-screen, #app-screen { width: 100%; max-width: 520px; padding: 32px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; }
h1 { font-size: 24px; margin-bottom: 4px; }
h2 { font-size: 16px; font-weight: 400; color: #8b949e; margin-bottom: 24px; }
label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #8b949e; }
input[type="text"] { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 16px; outline: none; transition: border-color .2s; }
input:focus { border-color: #58a6ff; }
input.token-input { font-size: 32px; letter-spacing: 12px; text-align: center; font-weight: 700; }
button { width: 100%; padding: 10px 16px; background: #238636; border: 1px solid #2ea043; border-radius: 6px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 16px; }
button:hover { background: #2ea043; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.danger { background: #da3633; border-color: #f85149; }
button.danger:hover { background: #f85149; }
.status { margin-top: 12px; font-size: 13px; text-align: center; color: #8b949e; }
.status.error { color: #f85149; }
.status.success { color: #3fb950; }
.url-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.url-bar input { flex: 1; font-size: 13px; }

#toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#toolbar h2 { margin: 0; font-size: 18px; font-weight: 600; color: #c9d1d9; }
#sub-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { background: #1f6feb; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
.badge.green { background: #238636; }
.badge.red { background: #da3633; }

#ptt-btn { display: block; width: 100%; padding: 18px; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all .1s; margin: 8px 0 4px 0; }
#ptt-btn.idle { background: #21262d; color: #8b949e; border: 2px solid #30363d; }
#ptt-btn.idle:hover { background: #30363d; }
#ptt-btn.active { background: #238636; color: #fff; border: 2px solid #2ea043; }
#ptt-btn.speaking { background: #da3633; color: #fff; border: 2px solid #f85149; }
#ptt-hint { font-size: 12px; color: #484f58; text-align: center; margin-bottom: 8px; }

#volume-meter { height: 4px; background: #21262d; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
#volume-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #238636, #2ea043); border-radius: 2px; }
#volume-fill.talking { background: linear-gradient(90deg, #da3633, #f85149); }

/* Mode toggle */
#mode-row { display: flex; gap: 8px; margin-bottom: 8px; }
.mode-btn { flex: 1; padding: 8px; border: 2px solid #30363d; border-radius: 6px; background: #0d1117; color: #8b949e; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; margin: 0; }
.mode-btn:hover { border-color: #58a6ff; color: #c9d1d9; }
.mode-btn.active { border-color: #58a6ff; color: #58a6ff; background: #0d1117; }

/* Sensitivity slider */
#vox-controls { margin-bottom: 8px; padding: 10px 12px; background: #0d1117; border-radius: 6px; border: 1px solid #21262d; }
#vox-controls label { font-size: 12px; color: #8b949e; margin: 0; }
#vox-controls .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
#vox-controls input[type="range"] { flex: 1; accent-color: #58a6ff; height: 4px; background: #30363d; border-radius: 2px; -webkit-appearance: none; appearance: none; }
#vox-controls input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #58a6ff; cursor: pointer; }
#vox-threshold-label { font-size: 11px; font-family: monospace; color: #8b949e; min-width: 32px; text-align: right; }

#vox-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #30363d; margin-right: 6px; vertical-align: middle; }
#vox-indicator.silence { background: #30363d; }
#vox-indicator.ambient { background: #d29922; }
#vox-indicator.speaking { background: #3fb950; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; padding: 8px; border-bottom: 1px solid #30363d; }
td { padding: 8px; border-bottom: 1px solid #21262d; font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace; }
tr:hover td { background: #161b22; }
tr.online td:first-child::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #3fb950; border-radius: 50%; margin-right: 8px; }
.uuid-col { color: #8b949e; font-size: 12px; }
.pos-col { color: #58a6ff; }
.coord { color: #c9d1d9; }

#mic-permit { margin: 12px 0 0; padding: 14px; background: #1f2937; border: 1px dashed #30363d; border-radius: 8px; text-align: center; cursor: pointer; transition: background .2s; }
#mic-permit:hover { background: #283541; }
#mic-permit h3 { font-size: 14px; font-weight: 500; color: #c9d1d9; }
#mic-permit p { font-size: 12px; color: #8b949e; margin-top: 4px; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="card">
    <h1>VoiceBridge</h1>
    <h2>Connect to your Minecraft server</h2>
    <div class="url-bar">
      <label style="display:none" for="ws-url">Server URL</label>
      <input type="text" id="ws-url" value="ws://localhost:8080" placeholder="ws://host:port">
    </div>
    <label for="token-input">Authentication Token</label>
    <input type="text" id="token-input" class="token-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="0000" autocomplete="off">
    <button id="connect-btn">Connect</button>
    <div id="auth-status" class="status"></div>
  </div>
</div>

<div id="app-screen" class="hidden">
  <div class="card">
    <div id="toolbar">
      <h2>VoiceBridge</h2>
      <button id="disconnect-btn" class="danger" style="width:auto;margin:0;padding:6px 14px;font-size:13px;">Leave</button>
    </div>
    <div id="status-bar" class="status success">Connected</div>

    <div id="mic-permit">
      <h3>Enable Microphone</h3>
      <p>Click to allow mic access for voice chat</p>
    </div>

    <div id="audio-controls" class="hidden">
      <div id="mode-row">
        <button id="mode-ptt" class="mode-btn active">PTT</button>
        <button id="mode-vox" class="mode-btn">VOX</button>
      </div>

      <div id="vox-controls" class="hidden">
        <div class="slider-row">
          <span id="vox-indicator" class="silence"></span>
          <label for="vox-threshold">Sensitivity</label>
          <input type="range" id="vox-threshold" min="0" max="100" value="25">
          <span id="vox-threshold-label">25</span>
        </div>
      </div>

      <div id="volume-meter"><div id="volume-fill"></div></div>
      <div id="ptt-hint">Press and hold <strong>Space</strong> or click to talk</div>
      <button id="ptt-btn" class="idle">Hold to Talk</button>
    </div>

    <div id="sub-bar">
      <span>Players <span class="badge" id="player-count">0</span></span>
      <span>Speaking <span class="badge green" id="speaking-count">0</span></span>
    </div>
    <table>
      <thead>
        <tr><th>Player</th><th>Position</th></tr>
      </thead>
      <tbody id="players-tbody"></tbody>
    </table>

    <div id="group-section" style="margin-top:12px;padding-top:12px;border-top:1px solid #21262d;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:13px;color:#8b949e;">Group: <strong id="group-name" style="color:#c9d1d9;">none</strong></span>
        <button id="group-manage-btn" style="width:auto;margin:0;padding:4px 12px;font-size:12px;">Manage</button>
      </div>
    </div>

    <!-- Group Modal -->
    <div id="group-modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;">
      <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;width:90%;max-width:440px;max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="font-size:18px;color:#c9d1d9;">Voice Groups</h3>
          <button id="group-modal-close" style="width:auto;margin:0;padding:4px 10px;font-size:13px;background:transparent;border:1px solid #30363d;color:#8b949e;">Close</button>
        </div>

        <div id="group-current" style="padding:10px 12px;background:#0d1117;border-radius:6px;margin-bottom:12px;font-size:13px;">
          Current: <strong id="group-current-name" style="color:#c9d1d9;">none</strong>
          <span id="group-current-type" style="color:#8b949e;font-size:11px;"></span>
        </div>

        <div id="group-actions" style="display:flex;gap:6px;margin-bottom:12px;">
          <button id="group-leave-btn" class="danger" style="flex:1;margin:0;padding:6px;font-size:13px;">Leave Group</button>
          <button id="group-refresh-btn" style="flex:1;margin:0;padding:6px;font-size:13px;background:#21262d;border-color:#30363d;">Refresh</button>
        </div>

        <div id="group-list"></div>

        <details style="margin-top:12px;">
          <summary style="cursor:pointer;color:#58a6ff;font-size:13px;font-weight:600;">Create Group</summary>
          <div style="margin-top:8px;">
            <input type="text" id="group-create-name" placeholder="Group name" style="margin-bottom:6px;font-size:14px;">
            <div style="display:flex;gap:6px;margin-bottom:6px;">
              <select id="group-create-type" style="flex:1;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px;">
                <option value="normal">Normal</option>
                <option value="open">Open</option>
                <option value="isolated">Isolated</option>
              </select>
              <input type="text" id="group-create-password" placeholder="Password (optional)" style="flex:1;font-size:13px;">
            </div>
            <button id="group-create-btn" style="margin:0;padding:6px;font-size:13px;">Create Group</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const urlToken = params.get('token');

const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const wsUrlInput = document.getElementById('ws-url');
const tokenInput = document.getElementById('token-input');
const connectBtn = document.getElementById('connect-btn');
const authStatus = document.getElementById('auth-status');
const disconnectBtn = document.getElementById('disconnect-btn');
const playersTbody = document.getElementById('players-tbody');
const playerCount = document.getElementById('player-count');
const speakingCount = document.getElementById('speaking-count');
const statusBar = document.getElementById('status-bar');
const pttBtn = document.getElementById('ptt-btn');
const pttHint = document.getElementById('ptt-hint');
const volumeFill = document.getElementById('volume-fill');
const audioControls = document.getElementById('audio-controls');
const micPermit = document.getElementById('mic-permit');
const modePtt = document.getElementById('mode-ptt');
const modeVox = document.getElementById('mode-vox');
const voxControls = document.getElementById('vox-controls');
const voxThreshold = document.getElementById('vox-threshold');
const voxThresholdLabel = document.getElementById('vox-threshold-label');
const voxIndicator = document.getElementById('vox-indicator');

let ws = null;
let connected = false;
let playerUuid = null;

// Audio
let audioCtx = null;
let micStream = null;
let scriptNode = null;
let micEnabled = false;

// Input mode: 'ptt' or 'vox'
let inputMode = 'ptt';
let pttActive = false;        // PTT: user is holding the button
let voxActive = false;        // VOX: currently transmitting because of voice

const SAMPLE_RATE = 48000;

// VOX state
const VOX_HOLD_MS = 600;      // keep transmitting this long after speech stops
let voxSilentStart = 0;       // timestamp when last silence began

// Playback (continuous gapless ring buffer; avoids gaps from chaining per-packet buffers)
let playGain = null;
let playScriptNode = null;
let playBuffer = null;
let playBufferSize = 0;
let playWrite = 0;
let playRead = 0;
let playBuffered = 0;

let speakingPlayers = new Set();

if (urlToken) {
  tokenInput.value = urlToken;
}

function setStatus(el, msg, type) {
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

function showApp() {
  authScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
}

function showAuth() {
  appScreen.classList.add('hidden');
  authScreen.classList.remove('hidden');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function updatePlayerTable(data) {
  playersTbody.innerHTML = '';
  if (!data || !data.players) {
    playerCount.textContent = '0';
    return;
  }
  playerCount.textContent = data.players.length;
  for (const p of data.players) {
    const tr = document.createElement('tr');
    tr.className = 'online';
    const label = (p.name && p.name !== '') ? p.name : (p.uuid ? p.uuid.substring(0, 8) + '...' : '?');
    const isSpeaking = speakingPlayers.has(p.uuid) ? '&#128266; ' : '';
    tr.innerHTML = `<td class="uuid-col">${isSpeaking}${escapeHtml(label)}</td><td class="pos-col"><span class="coord">${Number(p.x).toFixed(1)}</span>, <span class="coord">${Number(p.y).toFixed(1)}</span>, <span class="coord">${Number(p.z).toFixed(1)}</span></td>`;
    playersTbody.appendChild(tr);
  }
  speakingCount.textContent = speakingPlayers.size;
}

// ========== Audio Capture ==========
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
}

async function enableMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    initAudio();
    const source = audioCtx.createMediaStreamSource(micStream);

    scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
    source.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);

    scriptNode.onaudioprocess = (event) => {
      const input = event.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(input.length);
      let rms = 0;
      let peak = 0;

      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        rms += s * s;
        const abs = Math.abs(s);
        if (abs > peak) peak = abs;
      }
      rms = Math.sqrt(rms / input.length);

      // Update volume meter
      volumeFill.style.width = (peak * 100) + '%';

      // Decide whether to transmit
      let shouldTransmit = false;

      if (inputMode === 'ptt') {
        shouldTransmit = pttActive;
      } else {
        // VOX mode
        const threshold = parseInt(voxThreshold.value) / 100;
        if (rms > threshold * 0.5) {
          voxActive = true;
          voxSilentStart = 0;
          shouldTransmit = true;
          voxIndicator.className = 'speaking';
          volumeFill.className = 'talking';
        } else if (voxActive) {
          if (voxSilentStart === 0) {
            voxSilentStart = performance.now();
          }
          if (performance.now() - voxSilentStart < VOX_HOLD_MS) {
            shouldTransmit = true;
            voxIndicator.className = 'ambient';
          } else {
            voxActive = false;
            shouldTransmit = false;
            voxIndicator.className = 'silence';
            volumeFill.className = '';
          }
        } else {
          voxIndicator.className = 'silence';
          volumeFill.className = '';
        }
      }

      if (!shouldTransmit || !ws || ws.readyState !== WebSocket.OPEN) return;

      ws.send(pcm.buffer);
    };

    micEnabled = true;
    micPermit.classList.add('hidden');
    audioControls.classList.remove('hidden');
    voxThresholdLabel.textContent = voxThreshold.value;
    updateModeUI();
    statusBar.textContent = 'Mic enabled';
    statusBar.className = 'status success';
  } catch (err) {
    setStatus(authStatus, 'Mic access denied: ' + err.message, 'error');
  }
}

function disableMic() {
  pttActive = false;
  voxActive = false;
  if (scriptNode) {
    scriptNode.disconnect();
    scriptNode = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  micEnabled = false;
  audioControls.classList.add('hidden');
  micPermit.classList.remove('hidden');
  pttBtn.className = 'idle';
  pttBtn.textContent = 'Hold to Talk';
  volumeFill.style.width = '0%';
  volumeFill.className = '';
  voxIndicator.className = 'silence';
}

// ========== Playback ==========
function initPlayback() {
  if (playGain) return;
  initAudio();
  playGain = audioCtx.createGain();
  playGain.gain.value = 0.8;
  playGain.connect(audioCtx.destination);

  playBufferSize = SAMPLE_RATE; // 1 second of audio
  playBuffer = new Float32Array(playBufferSize);
  playWrite = 0;
  playRead = 0;
  playBuffered = 0;

  playScriptNode = audioCtx.createScriptProcessor(4096, 0, 1);
  playScriptNode.onaudioprocess = (event) => {
    const out = event.outputBuffer.getChannelData(0);
    for (let i = 0; i < out.length; i++) {
      if (playBuffered > 0) {
        out[i] = playBuffer[playRead];
        playRead = (playRead + 1) % playBufferSize;
        playBuffered--;
      } else {
        out[i] = 0;
      }
    }
  };
  playScriptNode.connect(playGain);
}

function feedPCM(pcmBuffer) {
  initPlayback();
  const pcm = new Int16Array(pcmBuffer);
  for (let i = 0; i < pcm.length; i++) {
    playBuffer[playWrite] = pcm[i] / (pcm[i] < 0 ? 0x8000 : 0x7FFF);
    playWrite = (playWrite + 1) % playBufferSize;
    if (playBuffered < playBufferSize) {
      playBuffered++;
    } else {
      // Ring full: drop the oldest sample to stay real-time.
      playRead = (playRead + 1) % playBufferSize;
    }
  }
}

// ========== Input Mode ==========
function setInputMode(mode) {
  inputMode = mode;
  voxActive = false;
  voxSilentStart = 0;
  updateModeUI();
}

function updateModeUI() {
  if (inputMode === 'ptt') {
    modePtt.classList.add('active');
    modeVox.classList.remove('active');
    voxControls.classList.add('hidden');
    pttBtn.classList.remove('hidden');
    pttHint.classList.remove('hidden');
    pttHint.innerHTML = 'Press and hold <strong>Space</strong> or click to talk';
    pttBtn.textContent = 'Hold to Talk';
    pttBtn.className = 'idle';
  } else {
    modePtt.classList.remove('active');
    modeVox.classList.add('active');
    voxControls.classList.remove('hidden');
    pttBtn.classList.add('hidden');
    pttHint.classList.remove('hidden');
    pttHint.innerHTML = 'Speak to activate &mdash; <strong>Space</strong> to mute';
    pttBtn.className = 'idle';
  }
}

modePtt.addEventListener('click', () => setInputMode('ptt'));
modeVox.addEventListener('click', () => setInputMode('vox'));

voxThreshold.addEventListener('input', () => {
  voxThresholdLabel.textContent = voxThreshold.value;
});

// ========== PTT Controls ==========
function startTalking() {
  if (!micEnabled || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (inputMode === 'vox') {
    // In VOX mode, Space toggles mute
    pttActive = !pttActive;
    if (pttActive) {
      pttBtn.className = 'speaking';
      pttBtn.textContent = 'Muted';
      pttHint.innerHTML = 'Microphone muted &mdash; press <strong>Space</strong> to unmute';
    } else {
      pttBtn.className = 'idle';
      pttBtn.textContent = 'Hold to Talk';
      pttHint.innerHTML = 'Speak to activate &mdash; <strong>Space</strong> to mute';
    }
    return;
  }
  pttActive = true;
  pttBtn.className = 'active';
  pttBtn.textContent = 'Talking...';
  pttHint.textContent = 'Release to mute';
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function stopTalking() {
  if (inputMode === 'vox') return; // handled by toggle in startTalking
  if (!pttActive) return;
  pttActive = false;
  pttBtn.className = 'idle';
  pttBtn.textContent = 'Hold to Talk';
  pttHint.innerHTML = 'Press and hold <strong>Space</strong> or click to talk';
  volumeFill.style.width = '0%';
}

// Mouse PTT (PTT mode only)
pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalking(); });
pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopTalking(); });
pttBtn.addEventListener('mouseleave', () => stopTalking());

// Touch PTT
pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && connected) {
    e.preventDefault();
    startTalking();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && connected) {
    e.preventDefault();
    stopTalking();
  }
});

// Mic permission
micPermit.addEventListener('click', enableMic);

// ========== WebSocket ==========
function connect() {
  const url = wsUrlInput.value.trim();
  if (!url) { setStatus(authStatus, 'Enter a WebSocket URL', 'error'); return; }
  const token = tokenInput.value.trim();
  if (!token || token.length !== 4) { setStatus(authStatus, 'Enter a 4-digit token', 'error'); return; }

  connectBtn.disabled = true;
  setStatus(authStatus, 'Connecting...', '');

  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStatus(authStatus, 'Invalid URL: ' + e.message, 'error');
    connectBtn.disabled = false;
    return;
  }

  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus(authStatus, 'Connected, authenticating...', '');
    ws.send(JSON.stringify({ type: 'auth', token: token }));
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      feedPCM(event.data);
      return;
    }
    try {
      const msg = JSON.parse(event.data);
      switch (msg.type) {
        case 'auth_success':
          connected = true;
          playerUuid = msg.uuid;
          setStatus(authStatus, 'Authenticated!', 'success');
          showApp();
          setStatus(statusBar, 'Connected', 'success');
          break;
        case 'positions':
          updatePlayerTable(msg);
          break;
        case 'speaking':
          handleSpeaking(msg);
          break;
        case 'group_my':
          updateGroupUI(msg);
          break;
        case 'group_list':
          updateGroupList(msg);
          break;
        case 'group_join_result':
        case 'group_leave_result':
        case 'group_create_result':
          if (msg.success) { sendMsg('group_list'); sendMsg('group_my'); }
          else { setStatus(authStatus, msg.error || 'Group operation failed', 'error'); }
          break;
        case 'pong':
          break;
      }
    } catch (e) {
      console.warn('Unparseable message:', event.data);
    }
  };

  ws.onclose = (event) => {
    disableMic();
    if (connected) {
      connected = false;
      setStatus(statusBar, 'Disconnected', 'error');
      showAuth();
      setStatus(authStatus, 'Disconnected (code: ' + event.code + ')', 'error');
    } else {
      setStatus(authStatus, 'Connection failed (code: ' + event.code + ')', 'error');
    }
    connectBtn.disabled = false;
    ws = null;
  };

  ws.onerror = () => {
    if (!connected) {
      setStatus(authStatus, 'Connection error', 'error');
      connectBtn.disabled = false;
    }
  };
}

function handleSpeaking(msg) {
  if (msg.speaking) {
    speakingPlayers.add(msg.uuid);
  } else {
    speakingPlayers.delete(msg.uuid);
  }
  speakingCount.textContent = speakingPlayers.size;
}

// ========== Group Management ==========
const groupName = document.getElementById('group-name');
const groupManageBtn = document.getElementById('group-manage-btn');
const groupModal = document.getElementById('group-modal');
const groupModalClose = document.getElementById('group-modal-close');
const groupCurrentName = document.getElementById('group-current-name');
const groupCurrentType = document.getElementById('group-current-type');
const groupLeaveBtn = document.getElementById('group-leave-btn');
const groupRefreshBtn = document.getElementById('group-refresh-btn');
const groupList = document.getElementById('group-list');
const groupCreateName = document.getElementById('group-create-name');
const groupCreateType = document.getElementById('group-create-type');
const groupCreatePassword = document.getElementById('group-create-password');
const groupCreateBtn = document.getElementById('group-create-btn');

function sendMsg(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function updateGroupUI(msg) {
  if (msg.name) {
    groupName.textContent = msg.name;
    groupCurrentName.textContent = msg.name;
    groupCurrentType.textContent = '(' + msg.type + ')';
    groupLeaveBtn.disabled = false;
  } else {
    groupName.textContent = 'none';
    groupCurrentName.textContent = 'none';
    groupCurrentType.textContent = '';
    groupLeaveBtn.disabled = true;
  }
}

function updateGroupList(msg) {
  groupList.innerHTML = '';
  if (!msg.groups || msg.groups.length === 0) {
    groupList.innerHTML = '<div style="color:#484f58;font-size:13px;text-align:center;padding:16px;">No groups available</div>';
    return;
  }
  for (const g of msg.groups) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #21262d;';
    div.innerHTML = `<div><strong style="color:#c9d1d9;font-size:14px;">${escapeHtml(g.name)}</strong><span style="color:#8b949e;font-size:11px;margin-left:6px;">${escapeHtml(g.type)}</span></div>`;
    const joinBtn = document.createElement('button');
    joinBtn.textContent = g.hasPassword ? 'Join (pw)' : 'Join';
    joinBtn.style.cssText = 'width:auto;margin:0;padding:4px 10px;font-size:12px;';
    joinBtn.addEventListener('click', () => {
      if (g.hasPassword) {
        const pw = prompt('Password for group "' + g.name + '":');
        if (pw === null) return;
        sendMsg({ type: 'group_join', name: g.name, password: pw });
      } else {
        sendMsg({ type: 'group_join', name: g.name });
      }
    });
    div.appendChild(joinBtn);
    groupList.appendChild(div);
  }
}

// Group modal
groupManageBtn.addEventListener('click', () => {
  groupModal.classList.remove('hidden');
  groupModal.style.display = 'flex';
  sendMsg({ type: 'group_my' });
  sendMsg({ type: 'group_list' });
});
groupModalClose.addEventListener('click', () => {
  groupModal.classList.add('hidden');
  groupModal.style.display = 'none';
});
groupModal.addEventListener('click', (e) => {
  if (e.target === groupModal) { groupModal.classList.add('hidden'); groupModal.style.display = 'none'; }
});
groupLeaveBtn.addEventListener('click', () => sendMsg({ type: 'group_leave' }));
groupRefreshBtn.addEventListener('click', () => { sendMsg({ type: 'group_list' }); sendMsg({ type: 'group_my' }); });
groupCreateBtn.addEventListener('click', () => {
  const name = groupCreateName.value.trim();
  if (!name) return;
  const type = groupCreateType.value;
  const pw = groupCreatePassword.value.trim() || null;
  sendMsg({ type: 'group_create', name, type, password: pw });
  groupCreateName.value = '';
  groupCreatePassword.value = '';
});

function disconnect() {
  disableMic();
  if (ws) {
    ws.close(1000, 'User disconnect');
    ws = null;
  }
  connected = false;
  speakingPlayers.clear();
  playBuffered = 0;
  playRead = 0;
  playWrite = 0;
  voxActive = false;
  pttActive = false;
  showAuth();
  setStatus(authStatus, 'Disconnected', '');
  connectBtn.disabled = false;
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
    playGain = null;
    playScriptNode = null;
  }
}

connectBtn.addEventListener('click', connect);
disconnectBtn.addEventListener('click', disconnect);

tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
wsUrlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenInput.focus(); });

tokenInput.addEventListener('input', () => {
  tokenInput.value = tokenInput.value.replace(/\D/g, '').slice(0, 4);
});

if (urlToken) {
  setTimeout(() => connect(), 300);
}
</script>
